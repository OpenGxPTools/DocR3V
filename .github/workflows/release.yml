name: Publish offline download

# The offline single-file build: one .html that a reviewer downloads, keeps,
# and can still open in five years with no network and nothing installed.
#
# Tag a release to publish one:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag must match APP_VERSION in src/version.ts. That is checked below and
# not merely documented, because the version is stamped into every exported
# report — a download whose file name disagrees with the version inside it
# would make a filed comparison untraceable.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tag must match the stamped version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          stamped=$(grep -oP "APP_VERSION = '\K[^']+" src/version.ts)
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$stamped" != "$tagged" ]; then
            echo "Tag $GITHUB_REF_NAME does not match APP_VERSION $stamped in src/version.ts." >&2
            exit 1
          fi
          echo "version=$stamped" >> "$GITHUB_ENV"

      - run: npm run test:run
      - run: npm run build:offline

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checksum=$(cut -d' ' -f1 "dist-offline/DocR3V-${version}.html.sha256")
          # github.io hostnames are lower-case; the owner name need not be.
          pages_host=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          cat > notes.md <<NOTES
          ## Download

          **[DocR3V-${version}.html](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/DocR3V-${version}.html)** — save it anywhere and double-click to open.

          It is the whole application in one file. Nothing to install, no internet
          connection needed after downloading, and the documents you compare never
          leave your computer.

          Prefer not to download anything? Use it in your browser instead:
          https://${pages_host}.github.io/${GITHUB_REPOSITORY#*/}/

          ## For records

          \`\`\`
          SHA-256  ${checksum}
          \`\`\`

          Reports exported by this file are stamped \`${version}\`. Keep the file
          alongside anything you file from it and the comparison can be repeated
          exactly, on a machine with no network access.
          NOTES

          gh release create "$GITHUB_REF_NAME" \
            --title "DocR3V ${version}" \
            --notes-file notes.md \
            "dist-offline/DocR3V-${version}.html" \
            "dist-offline/DocR3V-${version}.html.sha256"
