name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run

      # Both shipping shapes are built on every change, because they can break
      # independently: the offline build fails if anything stops being
      # inlineable, and only the hosted build exercises the service worker.
      - run: npm run build
      - run: npm run build:offline
