name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need to do?
      description: The review task, and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like DocR3V to do?
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: File formats involved (if any)
      placeholder: e.g. DOCX, ODT
